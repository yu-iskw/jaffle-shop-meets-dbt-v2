version: "3"

silent: true

vars:
  YEARS: 6
  DB: bigquery

tasks:
  venv:
    cmds:
      - uv sync --no-default-groups --group dev

  install:
    cmds:
      - uv sync --no-default-groups --group dev

  gen:
    cmds:
      - uv run --no-default-groups --group dev jafgen {{.YEARS}} && rm -rf seeds/jaffle-data && mv jaffle-data seeds

  seed:
    cmds:
      - >
        uv run --no-default-groups --with dbt-core --with dbt-{{.DB}}
        dbt seed --full-refresh --vars '{"load_source_data": true}'

  clean:
    cmds:
      - rm -rf jaffle-data

  load:
    cmds:
      - task: venv
      - task: install
      - task: gen
      - task: seed
      - task: clean
