[project]
name = "jaffle-shop-core-v2"
version = "0.1.0"
description = "Jaffle Shop dbt sandbox project"
readme = "README.md"
authors = [
    { name = "Yu Ishikawa", email = "yu-iskw@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests~=2.31.0",
]

[dependency-groups]
dev = [
    "jafgen>=0.4.11",
    "pre-commit>=3.6.0",
    "pytest>=8.0",
]
dbt-v2 = [
    "dbt>=2.0,<2.1",
]
jev = [
    "duckdb>=1.2.0",
    "typesafe-sdk>=0.7.0",
]
dbt-duckdb = [
    "dbt-core>=1.12,<2",
    "dbt-duckdb>=1.11,<2",
    "numpy>=2.5.3",
    "typesafe-sdk>=0.7.0",
]

[tool.uv]
package = false
default-groups = ["dev", "dbt-v2"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
